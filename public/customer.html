<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>طلبي | KartFlow</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1E4A44">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/config.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/catalog.js"></script>
  <script src="/js/logic.js"></script>
  <script src="/js/db.js"></script>
  <script src="/js/shell.js"></script>
</head>
<body>
  <div class="app" id="app">
    <main class="stage">
      <header class="band">
        <div class="container band-in">
          <div class="topbar">
            <a href="/" class="icon-btn sm" aria-label="الرئيسية"><i data-icon="chevron-right" data-size="20"></i></a>
            <div class="ttl"><b id="hdName">طلبي</b><small class="num" id="hdId">—</small></div>
            <button class="icon-btn sm" id="switchBtn" aria-label="طلباتي"><i data-icon="swap" data-size="18"></i></button>
          </div>

          <div class="journey" id="journey">
            <div class="jstep" data-s="new"><div class="c"><i data-icon="check" data-size="14"></i></div><span>استلام</span></div>
            <div class="jstep" data-s="picking"><div class="c"><i data-icon="cart" data-size="14"></i></div><span>تجميع</span></div>
            <div class="jstep" data-s="ready"><div class="c"><i data-icon="receipt" data-size="14"></i></div><span>جاهز</span></div>
            <div class="jstep" data-s="completed"><div class="c"><i data-icon="shield" data-size="14"></i></div><span>تسليم</span></div>
          </div>
        </div>
      </header>

      <div class="container page">
        <div class="view" data-view="track">
          <div class="stack-lg">
            <div id="subAlert"></div>
            <div id="heroWrap"></div>

            <div class="action-banner">
              <div class="action-banner-info">
                <div class="action-banner-ico"><i data-icon="store" data-size="20"></i></div>
                <div class="action-banner-text">
                  <span class="action-banner-title">إضافة أصناف أو طلب جديد</span>
                  <span class="action-banner-sub">تصفح 74 صنفاً من البقالة والألبان</span>
                </div>
              </div>
              <button class="action-banner-btn" id="trackShopBtn">
                <i data-icon="plus" data-size="15"></i>
                <span>تسوق الآن</span>
              </button>
            </div>

            <div>
              <div class="section-title"><h2>أصناف طلبك</h2><span class="num" id="doneTxt">0 / 0</span></div>
              <div class="list" id="trackList"></div>
            </div>
          </div>
        </div>

        <div class="view" data-view="items">
          <div class="section-title"><h2>الفاتورة</h2><span class="badge b-gold" id="editBadge" hidden>التعديل متاح</span></div>
          <div class="stack">
            <div class="list" id="fullList"></div>
            <div class="card soft" id="sumCard"></div>
          </div>
        </div>

        <div class="view" data-view="shop">
          <div class="stack-lg">
            <div class="searchbar"><i data-icon="search" data-size="20" class="faint"></i><input type="search" id="q" placeholder="ابحث عن صنف"></div>
            <div class="chips" id="chips"></div>
            <div>
              <div class="section-title"><h2>الأصناف</h2><span class="num" id="catCount">0</span></div>
              <div class="pgrid" id="grid"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let orders = [], cur = null, dept = 'all', query = '', bucket = [], subTimer = null;
      const ORDER = ['new', 'picking', 'ready', 'completed'];
      const $ = id => document.getElementById(id);
      const tintOf = d => (Catalog.dept(d) || {}).tint || 'sand';

      Shell.mount({
        role: 'customer', initial: 'track',
        tabs: [
          { id: 'track', label: 'تتبع', icon: 'clock' },
          { id: 'items', label: 'الفاتورة', icon: 'list' },
          { id: 'shop', label: 'تسوق', icon: 'store' }
        ],
        center: { id: 'cart', label: 'السلة', icon: 'bag', act: true },
        onAction: act => { if (act === 'cart') openCart(); }
      });

      AppDB.onOrders(list => {
        orders = list;
        if (cur) cur = orders.find(o => o.id === cur.id) || null;
        if (!cur) cur = orders.find(o => !['completed', 'cancelled'].includes(o.status)) || orders[orders.length - 1] || null;
        render();
      });
      AppDB.seedIfEmpty().catch(() => {});

      const tsb = $('trackShopBtn');
      if (tsb) tsb.onclick = () => Shell.go('shop');

      $('switchBtn').onclick = () => {
        const body = Shell.openSheet({
          title: 'طلباتي',
          html: `<div class="stack">
            <div class="list">${orders.map(o => `
            <div class="irow tap ${cur && cur.id === o.id ? 'sel' : ''}" data-id="${o.id}">
              <div class="grow"><div class="nm">${o.customer.name}</div><div class="sub"><span class="num">${o.id}</span><span class="dot"></span><span class="num">${Shell.money(o.total)}</span></div></div>
              <span class="badge ${o.status === 'ready' ? 'b-ok' : o.status === 'completed' ? 'b-mute' : 'b-gold'}">${o.status === 'ready' ? 'جاهز' : o.status === 'completed' ? 'مكتمل' : 'قيد التجهيز'}</span>
            </div>`).join('')}</div>
            <button class="btn btn-gold block" id="newOrderSheetBtn"><i data-icon="plus" data-size="18"></i><span>إنشاء طلب جديد</span></button>
          </div>`
        });
        Icons.mount();
        body.querySelectorAll('[data-id]').forEach(el => el.onclick = () => { cur = orders.find(o => o.id === el.dataset.id); Shell.closeSheet(); render(); });
        const nb = body.querySelector('#newOrderSheetBtn');
        if (nb) nb.onclick = () => { Shell.closeSheet(); Shell.go('shop'); Shell.toast('اختر الأصناف ثم افتح السلة', { tone: 'ink' }); };
      };

      function render() {
        renderJourney(); renderHero(); renderSub(); renderTrack(); renderFull(); renderCatalog();
        Icons.mount();
      }

      function renderJourney() {
        const idx = cur ? ORDER.indexOf(cur.status) : -1;
        document.querySelectorAll('.jstep').forEach((el, i) => {
          el.classList.toggle('done', cur && (i < idx || cur.status === 'completed'));
          el.classList.toggle('now', cur && i === idx && cur.status !== 'completed');
        });
        // "new" is shown as step 1 done, picking as current
        if (cur && cur.status === 'new') { const s = document.querySelectorAll('.jstep'); s[0].classList.add('done'); s[0].classList.remove('now'); s[1].classList.add('now'); }
        if (cur && cur.status === 'picking') { document.querySelectorAll('.jstep')[0].classList.add('done'); }
        $('hdName').textContent = cur ? `أهلاً ${Shell.firstName(cur.customer.name)}` : 'مرحباً بك';
        $('hdId').textContent = cur ? cur.id : 'KartFlow';
      }

      function renderHero() {
        const w = $('heroWrap');
        if (!cur) {
          w.innerHTML = `<div class="card"><div class="empty">${Art.cart(false, 'art')}<h3>لا يوجد طلب نشط</h3><button class="btn btn-gold" id="startBtn"><i data-icon="plus" data-size="18"></i><span>ابدأ طلباً</span></button></div></div>`;
          $('startBtn').onclick = () => Shell.go('shop');
          return;
        }
        Logic.expireSubs(cur);
        const p = Logic.progress(cur), eta = Logic.etaMin(cur);
        const st = {
          new: ['بانتظار العربة', `خلال ${eta} د`], picking: ['جاري تجهيز طلبك', `خلال ${eta} د`],
          ready: ['طلبك جاهز', 'توجّه للكاشير'], completed: ['تم التسليم', 'شكراً لك'], cancelled: ['تم الإلغاء', '']
        }[cur.status] || ['', ''];
        w.innerHTML = `
          <div class="card forest glow">
            <div class="row" style="gap: 16px;">
              ${Shell.ring(p.pct, 76)}
              <div class="grow"><h2 class="t-h2" style="margin-bottom: 4px;">${st[0]}</h2>
                <div class="row-sm muted" style="font-size: 13.5px;"><i data-icon="timer" data-size="15"></i><span class="num">${st[1]}</span></div></div>
            </div>
            <div class="row between" style="margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(244,241,232,.12);">
              <span class="muted" style="font-size: 13.5px;">الإجمالي</span>
              <b class="num gold" style="font-size: 18px;">${Shell.money(cur.total)}</b>
            </div>
          </div>`;
      }

      function renderSub() {
        const w = $('subAlert'); clearInterval(subTimer);
        const s = cur && Logic.pendingSubs(cur)[0];
        if (!s) { w.innerHTML = ''; return; }
        w.innerHTML = `
          <div class="card rise" style="background: linear-gradient(150deg, #FFF8E6, #FDEFC8); border: 1.5px solid var(--gold);">
            <div class="row between" style="margin-bottom: 12px;">
              <span class="badge b-warn"><i data-icon="alert" data-size="14"></i><span>بديل مقترح</span></span>
              <b class="num" id="subLeft" style="color: var(--bad); font-size: 15px;">${Shell.mmss(s.expiresAt - Date.now())}</b>
            </div>
            <p style="font-size: 14px; color: #5C4008; margin-bottom: 12px;"><b>${s.fromName}</b> غير متوفر</p>
            <div class="irow" style="margin-bottom: 14px;">
              <div class="tile tile-sm t-${tintOf(s.to.dept)}">${Art.dept(s.to.dept)}</div>
              <div class="grow"><div class="nm">${s.to.name}</div><div class="sub num">${Shell.money(s.to.price)}</div></div>
            </div>
            <div class="btn-row">
              <button class="btn btn-gold" id="subYes"><i data-icon="check" data-size="18"></i><span>موافق</span></button>
              <button class="btn btn-bad" id="subNo"><i data-icon="x" data-size="18"></i><span>رفض</span></button>
            </div>
          </div>`;
        $('subYes').onclick = () => respond(s.id, 'accepted');
        $('subNo').onclick = () => respond(s.id, 'rejected');
        subTimer = setInterval(() => {
          const left = s.expiresAt - Date.now(), el = $('subLeft');
          if (el) el.textContent = Shell.mmss(left);
          if (left <= 0) { clearInterval(subTimer); AppDB.update(cur.id, o => Logic.expireSubs(o)); }
        }, 1000);
      }

      async function respond(subId, decision) {
        Shell.haptic();
        await AppDB.update(cur.id, o => Logic.answerSub(o, subId, decision));
        Shell.toast(decision === 'accepted' ? 'تمت الموافقة' : 'تم الرفض', { tone: 'ok' });
      }

      function renderTrack() {
        const list = $('trackList');
        if (!cur) { list.innerHTML = ''; $('doneTxt').textContent = '0 / 0'; return; }
        const live = Logic.liveItems(cur), done = live.filter(i => i.status === 'picked').length;
        $('doneTxt').textContent = `${done} / ${live.length}`;
        const anim = Shell.first('track') ? 'rise' : '';
        list.innerHTML = live.map((it, i) => {
          const ok = it.status === 'picked';
          return `<div class="irow ${anim}" style="--i:${i}">
            <div class="tile tile-sm t-${tintOf(it.dept)}">${Art.dept(it.dept)}</div>
            <div class="grow"><div class="nm" style="${ok ? 'opacity:.55;text-decoration:line-through;' : ''}">${it.name}</div>
              <div class="sub"><span class="num">${Shell.qtyText(it)}</span><span class="dot"></span><span class="num">${Shell.money(it.price)}</span></div></div>
            <span class="st ${ok ? 'ok' : it.status === 'unavailable' ? 'bad' : 'wait'}"><i data-icon="${ok ? 'check' : it.status === 'unavailable' ? 'swap' : 'clock'}" data-size="16"></i></span>
          </div>`;
        }).join('') || `<div class="card soft center" style="padding:20px;"><span class="muted">لا توجد أصناف</span></div>`;
      }

      function renderFull() {
        const list = $('fullList'), sum = $('sumCard');
        if (!cur) { list.innerHTML = `<div class="card soft center" style="padding:20px;"><span class="muted">لا توجد فاتورة</span></div>`; sum.hidden = true; return; }
        sum.hidden = false;
        const edit = Logic.isEditable(cur);
        $('editBadge').hidden = !edit;
        list.innerHTML = cur.items.map(it => `
          <div class="irow">
            <div class="tile tile-sm t-${tintOf(it.dept)}">${Art.dept(it.dept)}</div>
            <div class="grow"><div class="nm">${it.name}</div><div class="sub"><span class="num">${Shell.qtyText(it)}</span><span class="dot"></span><span class="num">${Shell.money(Logic.itemTotal(it) || it.price)}</span></div></div>
            ${edit && it.status === 'pending' ? `<button class="icon-btn sm" data-del="${it.id}" aria-label="حذف"><i data-icon="trash" data-size="16" style="color:var(--bad)"></i></button>`
              : `<span class="st ${it.status === 'picked' ? 'ok' : it.status === 'cancelled' ? 'bad' : 'wait'}"><i data-icon="${it.status === 'picked' ? 'check' : it.status === 'cancelled' ? 'x' : 'clock'}" data-size="16"></i></span>`}
          </div>`).join('');
        list.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
          await AppDB.update(cur.id, o => Logic.removeItem(o, b.dataset.del));
          Shell.toast('تم الحذف', { tone: 'ok' });
        });
        sum.innerHTML = `
          <div class="row between" style="margin-bottom: 8px;"><span class="muted">الأصناف</span><span class="num">${Shell.money(cur.total)}</span></div>
          <div class="row between" style="margin-bottom: 12px;"><span class="muted">التجهيز</span><span class="badge b-ok">مجاني</span></div>
          <div class="row between" style="padding-top: 12px; border-top: 1px dashed var(--line); font-size: 17px; font-weight: 700;"><span>المجموع</span><span class="num">${Shell.money(cur.total)}</span></div>`;
      }

      function renderCatalog() {
        $('chips').innerHTML = [{ id: 'all', name: 'الكل' }].concat(Catalog.DEPTS).map(d => `<button class="chip ${dept === d.id ? 'on' : ''}" data-d="${d.id}">${d.name}</button>`).join('');
        $('chips').querySelectorAll('[data-d]').forEach(b => b.onclick = () => { dept = b.dataset.d; renderCatalog(); Icons.mount(); });
        let prods = Catalog.products;
        if (dept !== 'all') prods = prods.filter(p => p.dept === dept);
        if (query) prods = prods.filter(p => p.name.includes(query));
        $('catCount').textContent = prods.length;
        $('grid').innerHTML = prods.length ? prods.map(p => `
          <div class="pcard">
            <div class="tile t-${tintOf(p.dept)}">${Art.dept(p.dept)}</div>
            <div class="pname">${p.name}</div>
            <div class="pfoot"><span class="price num">${Shell.money(p.price)}</span><button class="add-btn" data-add="${p.id}" aria-label="إضافة"><i data-icon="plus" data-size="18"></i></button></div>
          </div>`).join('') : `<div class="card soft center" style="grid-column:1/-1;padding:20px;"><span class="muted">لا نتائج</span></div>`;
        $('grid').querySelectorAll('[data-add]').forEach(b => b.onclick = () => add(b.dataset.add));
      }
      $('q').addEventListener('input', e => { query = e.target.value.trim(); renderCatalog(); Icons.mount(); });

      async function add(pid) {
        const p = Catalog.byId(pid); if (!p) return;
        Shell.haptic();
        const ex = bucket.find(x => x.pid === pid);
        if (ex) ex.qty++; else bucket.push({ pid, qty: 1 });
        Shell.badge('cart', bucket.reduce((s, x) => s + x.qty, 0));
        Shell.toast('أُضيف إلى السلة', { tone: 'ok' });
      }

      function openCart() {
        if (!bucket.length) {
          return Shell.openSheet({
            title: 'السلة',
            html: `<div class="empty">${Art.cart(false, 'art')}<h3>السلة فارغة</h3><button class="btn btn-gold" id="goShopBtn"><span>تصفّح الأصناف</span></button></div>`,
            onMount: b => {
              const g = b.querySelector('#goShopBtn');
              if (g) g.onclick = () => { Shell.closeSheet(); Shell.go('shop'); };
              Icons.mount();
            }
          });
        }
        const lines = bucket.map(b => ({ p: Catalog.byId(b.pid), q: b.qty })).filter(l => l.p);
        const total = lines.reduce((s, l) => s + l.p.price * l.q, 0);
        const canAddCur = cur && Logic.isEditable(cur);
        Shell.openSheet({
          title: 'سلتي',
          html: `<div class="stack">
            <div class="list">${lines.map(l => `<div class="irow"><div class="tile tile-sm t-${tintOf(l.p.dept)}">${Art.dept(l.p.dept)}</div><div class="grow"><div class="nm">${l.p.name}</div><div class="sub num">${Shell.money(l.p.price)}</div></div><b class="num none">× ${l.q}</b></div>`).join('')}</div>
            <div class="row between" style="font-size: 17px; font-weight: 700; padding-top: 6px;"><span>المجموع</span><span class="num">${Shell.money(total)}</span></div>
            <input type="text" class="input" id="custNameInp" placeholder="اسم العميل (مثال: محمد علي)" value="محمد علي">
            <button class="btn btn-gold shine block lg" id="sendOrder"><i data-icon="plus" data-size="20"></i><span>إرسال كطلب جديد</span></button>
            ${canAddCur ? `<button class="btn btn-soft block" id="appendOrder"><i data-icon="check" data-size="18"></i><span>إضافة للطلب الحالي (${cur.id})</span></button>` : ''}
          </div>`,
          onMount: body => {
            body.querySelector('#sendOrder').onclick = async () => {
              const nm = (body.querySelector('#custNameInp').value || '').trim() || 'عميل جديد';
              const o = Logic.makeOrder({ name: nm, lines: bucket });
              await AppDB.put(o);
              bucket = []; Shell.badge('cart', 0); cur = o;
              Shell.closeSheet(); Shell.go('track'); render();
              Shell.toast('تم إنشاء الطلب', { tone: 'ok' });
            };
            const ap = body.querySelector('#appendOrder');
            if (ap) ap.onclick = async () => {
              await AppDB.update(cur.id, o => Logic.addLines(o, bucket));
              bucket = []; Shell.badge('cart', 0);
              Shell.closeSheet(); Shell.go('track'); render();
              Shell.toast('أُضيفت الأصناف للطلب', { tone: 'ok' });
            };
          }
        });
        Icons.mount();
      }
    });
  </script>
</body>
</html>
