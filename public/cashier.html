<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>الكاشير | KartFlow</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1E4A44">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/config.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/catalog.js"></script>
  <script src="/js/logic.js"></script>
  <script src="/js/db.js"></script>
  <script src="/js/shell.js"></script>
  <script src="/js/scanner.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <div class="app" id="app">
    <main class="stage">
      <header class="band">
        <div class="container band-in">
          <div class="topbar">
            <a href="/" class="icon-btn sm" aria-label="الرئيسية"><i data-icon="chevron-right" data-size="20"></i></a>
            <div class="ttl"><b>الكاشير</b><small>بوابة العبور السريع</small></div>
            <span class="badge b-glass num">POS 01</span>
          </div>

          <div class="card ink" style="padding: 14px 16px;">
            <div class="row between">
              <div class="grow">
                <small class="muted" style="display:block;font-size:12px;">بانتظار الاعتماد</small>
                <b class="num gold" id="readyCount" style="font-size:19px;">0 طلب</b>
              </div>
              <button class="btn btn-gold shine sm none" id="scanTopBtn">
                <i data-icon="qr" data-size="18"></i>
                <span>مسح الرمز</span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <div class="container page">
        <div class="view" data-view="audit">
          <div class="stack-lg sx">
            <div>
              <div class="section-title"><h2>الطلبات الجاهزة</h2><span class="num" id="readySub">0</span></div>
              <div class="list" id="readyList"></div>
            </div>
            <div id="ticketWrap"></div>
          </div>
        </div>

        <div class="view" data-view="cleared">
          <div class="section-title"><h2>الفواتير المعتمدة</h2><span class="num" id="clearedCount">0</span></div>
          <div class="list" id="clearedList"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let orders = [], sel = null;
      const $ = id => document.getElementById(id);

      Shell.mount({
        role: 'cashier', initial: 'audit',
        tabs: [
          { id: 'audit', label: 'الفحص', icon: 'scan' },
          { id: 'cleared', label: 'السجل', icon: 'receipt' }
        ],
        center: { id: 'scan-master', label: 'مسح', icon: 'qr', act: true },
        onAction: act => { if (act === 'scan-master') openScanner(); }
      });

      $('scanTopBtn').onclick = openScanner;
      Scanner.hardware(code => handleCode(code));
      AppDB.onOrders(list => { orders = list; sync(); });
      AppDB.seedIfEmpty().catch(() => {});

      function sync() {
        const ready = orders.filter(o => o.status === 'ready');
        const active = orders.filter(o => ['ready', 'picking', 'new'].includes(o.status));
        const cleared = orders.filter(o => o.status === 'completed');

        $('readyCount').textContent = `${ready.length} طلب`;
        $('readySub').textContent = ready.length || active.length;
        $('clearedCount').textContent = cleared.length;

        const pool = ready.length ? ready : active;
        if (sel) sel = orders.find(o => o.id === sel.id && o.status !== 'completed') || null;
        if (!sel && pool.length) sel = pool[0];

        renderReady(pool);
        renderTicket(sel);
        renderCleared(cleared);
        Icons.mount();
      }

      function renderReady(pool) {
        const el = $('readyList');
        if (!pool.length) {
          el.innerHTML = `<div class="card soft center" style="padding:20px;"><span class="muted">لا توجد طلبات حالياً</span></div>`;
          return;
        }
        const anim = Shell.first('ready') ? 'rise' : '';
        el.innerHTML = pool.map((o, i) => `
          <div class="irow tap ${sel && sel.id === o.id ? 'sel' : ''} ${anim}" style="--i:${i}" data-id="${o.id}">
            <span class="bin lg ${o.bin || 'A'}">${o.bin || 'A'}</span>
            <div class="grow">
              <div class="nm">${o.customer.name}</div>
              <div class="sub"><span class="num">${o.id}</span><span class="dot"></span><span class="num">${Logic.liveItems(o).length} أصناف</span></div>
            </div>
            <span class="badge ${o.status === 'ready' ? 'b-ok' : 'b-gold'}">${o.status === 'ready' ? 'جاهز' : 'جاري'}</span>
          </div>`).join('');
        el.querySelectorAll('[data-id]').forEach(r => r.onclick = () => {
          sel = orders.find(o => o.id === r.dataset.id);
          sync();
        });
      }

      function renderTicket(o) {
        const w = $('ticketWrap');
        if (!o) { w.innerHTML = ''; return; }
        const live = Logic.liveItems(o);
        const isReady = o.status === 'ready';
        w.innerHTML = `
          <div class="ticket rise">
            <div class="ticket-top">
              <div class="row between" style="margin-bottom: 14px;">
                <div class="row-sm">
                  <span class="bin ${o.bin || 'A'}">${o.bin || 'A'}</span>
                  <span class="badge b-glass num">${o.id}</span>
                </div>
                <span class="badge ${isReady ? 'b-ok' : 'b-gold'}">${isReady ? 'مدقق 100%' : 'قيد التجميع'}</span>
              </div>
              <div class="row between">
                <div class="grow">
                  <h3 class="t-h2 ell" style="color:#F4F1E8;">${o.customer.name}</h3>
                  <small class="muted num">${o.cartId || 'CART-01'}</small>
                </div>
                <div class="none" style="text-align:end;">
                  <small class="muted" style="display:block;font-size:11.5px;">الإجمالي</small>
                  <b class="num gold" style="font-size:22px;">${Shell.money(o.total)}</b>
                </div>
              </div>
            </div>

            <div class="ticket-tear"></div>

            <div class="ticket-body">
              <div class="section-title" style="margin-bottom: 8px;">
                <h3 style="font-size:15px;">الأصناف</h3>
                <span class="num">${live.length}</span>
              </div>

              <div style="margin-bottom: 18px;">
                ${live.map(it => `
                  <div class="line">
                    <div class="row-sm grow">
                      <i data-icon="${it.status === 'picked' ? 'check-circle' : 'clock'}" data-size="16" style="color:${it.status === 'picked' ? 'var(--ok)' : 'var(--fg-3)'}"></i>
                      <span class="ell" style="font-weight:600;">${it.name}</span>
                    </div>
                    <div class="row-sm none">
                      <span class="num muted">× ${it.qty}</span>
                      <b class="num">${Shell.money(Logic.itemTotal(it))}</b>
                    </div>
                  </div>`).join('')}
              </div>

              <button class="btn btn-ok block lg" id="approveBtn">
                <i data-icon="shield" data-size="20"></i>
                <span>اعتماد وتصريح خروج</span>
              </button>
            </div>
          </div>`;

        $('approveBtn').onclick = () => approve(o);
      }

      async function approve(o) {
        Shell.haptic();
        await AppDB.update(o.id, ord => {
          ord.items.forEach(it => { if (it.status === 'pending') { it.picked = it.qty; it.status = 'picked'; } });
          Logic.settle(ord);
          return Logic.complete(ord);
        });
        Shell.burst(`
          <div class="check-draw"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
          <h2 class="t-h2" style="margin-bottom: 6px;">تم الاعتماد</h2>
          <p class="muted ell" style="margin-bottom: 12px; font-size: 14px;">${o.customer.name}</p>
          <span class="badge b-ok num">PASS #${o.id}</span>`, 1900);
        sel = null;
      }

      function renderCleared(list) {
        const el = $('clearedList');
        if (!list.length) {
          el.innerHTML = `<div class="card soft center" style="padding:20px;"><span class="muted">لا توجد فواتير معتمدة بعد</span></div>`;
          return;
        }
        el.innerHTML = list.map(o => `
          <div class="irow">
            <span class="st ok"><i data-icon="check" data-size="16"></i></span>
            <div class="grow">
              <div class="nm">${o.customer.name}</div>
              <div class="sub"><span class="num">${o.id}</span><span class="dot"></span><span class="num">${Shell.clock(o.completedAt || o.createdAt)}</span></div>
            </div>
            <b class="num none">${Shell.money(o.total)}</b>
          </div>`).join('');
      }

      function openScanner() {
        Shell.openSheet({
          title: 'مسح رمز العربة',
          html: Scanner.markup({ placeholder: 'أو اكتب رقم الطلب', demo: true }),
          onMount: body => {
            Scanner.start('reader', code => handleCode(code), () => {
              const s = body.querySelector('#vfState');
              if (s) { s.hidden = false; s.textContent = 'الكاميرا غير متاحة'; }
            });
            body.querySelector('#manualGo').onclick = () => {
              const v = body.querySelector('#manualCode').value.trim();
              if (v) handleCode(v);
            };
            const d = body.querySelector('#demoScan');
            if (d) {
              d.querySelector('span').textContent = 'استدعاء أول عربة';
              d.onclick = () => {
                const target = orders.find(o => o.status === 'ready') || orders.find(o => o.status !== 'completed');
                if (target) handleCode(target.id);
                else Shell.toast('لا توجد طلبات', { tone: 'warn' });
              };
            }
          },
          onClose: () => Scanner.stop()
        });
        Icons.mount();
      }

      function handleCode(code) {
        if (!code) return;
        Shell.closeSheet();
        let id = code;
        try {
          const p = JSON.parse(code);
          if (p.orders && p.orders[0]) id = p.orders[0];
          else if (p.cart) {
            const f = orders.find(o => o.cartId === p.cart && o.status !== 'completed');
            if (f) id = f.id;
          }
        } catch (e) {}
        const m = orders.find(o => o.id === id || o.cartId === id);
        if (m) {
          sel = m;
          Shell.go('audit');
          sync();
          Shell.toast(`تم فتح ${m.id}`, { tone: 'ok' });
        } else {
          Shell.toast('الرمز غير معروف', { tone: 'bad' });
        }
      }
    });
  </script>
</body>
</html>
