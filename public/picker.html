<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>عربة التجميع | KartFlow</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1E4A44">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/config.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/catalog.js"></script>
  <script src="/js/logic.js"></script>
  <script src="/js/db.js"></script>
  <script src="/js/shell.js"></script>
  <script src="/js/scanner.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
  <div class="app" id="app">
    <main class="stage">
      <header class="band">
        <div class="container band-in">
          <div class="topbar">
            <a href="/" class="icon-btn sm" aria-label="الرئيسية"><i data-icon="chevron-right" data-size="20"></i></a>
            <div class="ttl"><b>عربة 01</b><small>أحمد طارق</small></div>
            <span class="badge b-glass num" id="ordersBadge">0 طلب</span>
          </div>

          <div class="row between" style="margin-bottom: 10px;">
            <span style="font-size: 13.5px; font-weight: 600;">تقدّم الجولة</span>
            <b class="num gold" id="routeNum" style="font-size: 14px;">0 / 0</b>
          </div>
          <div class="bar"><i id="routeBar" style="--p: 0;"></i></div>
        </div>
      </header>

      <div class="container page">
        <div class="view" data-view="route">
          <div class="stack-lg sx">
            <div id="heroWrap"></div>
            <div>
              <div class="section-title"><h2>التالي</h2><span class="num" id="remainTxt">0</span></div>
              <div class="list" id="upcoming"></div>
            </div>
          </div>
        </div>

        <div class="view" data-view="bins">
          <div class="section-title"><h2>الصناديق</h2><span>A · B · C</span></div>
          <div class="stack" id="binsWrap"></div>
        </div>

        <div class="view" data-view="orders">
          <div class="section-title"><h2>الطلبات</h2><span class="num" id="ordersCount">0</span></div>
          <div class="stack" id="ordersWrap"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const CART_ID = 'CART-01';
      const DONE = ['completed', 'cancelled'];
      const claiming = new Set();
      let allOrders = [], cartOrders = [], currentItem = null;

      function beep(ok = true) {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.frequency.setValueAtTime(ok ? 920 : 260, ctx.currentTime);
          if (ok) o.frequency.setValueAtTime(1440, ctx.currentTime + .08);
          g.gain.setValueAtTime(.18, ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .22);
          o.start(); o.stop(ctx.currentTime + .22);
        } catch (e) {}
      }

      Shell.mount({
        role: 'picker', initial: 'route',
        tabs: [
          { id: 'route', label: 'المسار', icon: 'route' },
          { id: 'bins', label: 'الصناديق', icon: 'box' },
          { id: 'orders', label: 'الطلبات', icon: 'list' }
        ],
        center: { id: 'scan', label: 'مسح', icon: 'scan', act: true },
        onAction: act => { if (act === 'scan') openScanner(); }
      });

      Scanner.hardware(code => handleScan(code));
      AppDB.onOrders(list => { allOrders = list; sync(); });
      AppDB.seedIfEmpty().catch(() => {});

      function sync() {
        // give every new order a free bin on this cart
        const used = new Set(allOrders.filter(o => o.cartId === CART_ID && !DONE.includes(o.status)).map(o => o.bin));
        allOrders.forEach(o => {
          if (o.status !== 'new' || o.cartId || claiming.has(o.id)) return;
          const bin = Logic.BINS.find(b => !used.has(b));
          if (!bin) return;
          used.add(bin); claiming.add(o.id);
          AppDB.update(o.id, ord => Logic.claim(ord, CART_ID, bin)).finally(() => claiming.delete(o.id));
        });

        cartOrders = allOrders.filter(o => o.cartId === CART_ID && !DONE.includes(o.status));
        const route = Logic.route(cartOrders);
        const total = cartOrders.reduce((s, o) => s + Logic.liveItems(o).length, 0);
        const done = cartOrders.reduce((s, o) => s + Logic.liveItems(o).filter(i => i.status === 'picked').length, 0);
        const pct = total ? Math.round(done / total * 100) : 0;

        document.getElementById('ordersBadge').textContent = `${cartOrders.length} طلب`;
        document.getElementById('routeNum').textContent = `${done} / ${total}`;
        document.getElementById('routeBar').style.setProperty('--p', pct);
        document.getElementById('remainTxt').textContent = Math.max(0, route.length - 1);
        document.getElementById('ordersCount').textContent = cartOrders.length;

        currentItem = route[0] || null;
        renderHero();
        renderUpcoming(route.slice(1));
        renderBins();
        renderOrders();
        Icons.mount();
      }

      function renderHero() {
        const wrap = document.getElementById('heroWrap');
        if (!currentItem) {
          if (!cartOrders.length) {
            wrap.innerHTML = `<div class="card"><div class="empty">${Art.cart(false, 'art')}<h3>لا توجد طلبات</h3><p>ستظهر الطلبات الجديدة هنا</p></div></div>`;
            return;
          }
          wrap.innerHTML = `
            <div class="card ink center glow" style="padding: 28px 20px;">
              <div class="check-draw"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
              <h2 class="t-h1" style="margin-bottom: 4px;">اكتمل التجميع</h2>
              <p class="muted" style="margin-bottom: 20px; font-size: 14px;">اعرض الرمز عند الكاشير</p>
              <div style="background:#fff; padding:14px; border-radius:20px; display:inline-block; box-shadow: var(--shadow-2); animation: pop .7s .2s var(--spring) both;"><canvas id="qr"></canvas></div>
            </div>`;
          setTimeout(() => {
            const c = document.getElementById('qr');
            if (c && window.QRCode) QRCode.toCanvas(c, JSON.stringify({ cart: CART_ID, orders: cartOrders.map(o => o.id) }), { width: 168, margin: 1 });
          }, 60);
          return;
        }

        const it = currentItem.item, ord = currentItem.order, dp = Catalog.dept(it.dept) || {};
        const qty = it.type === 'weight' ? `${it.qty} ${it.unit}` : `${it.qty} ${it.unit}`;
        wrap.innerHTML = `
          <div class="card ink glow">
            <div class="row between" style="margin-bottom: 18px;">
              <div class="loc"><div class="big num">${it.aisle}</div><div><small>الممر</small><b>رف ${String(it.shelf).padStart(2, '0')}</b></div></div>
              <div class="row-sm none"><div style="text-align:end;line-height:1.3;"><small class="muted" style="display:block;font-size:11.5px;">صندوق</small><b class="ell" style="display:block;max-width:70px;font-size:13px;">${Shell.firstName(ord.customer.name)}</b></div><span class="bin lg ${ord.bin}">${ord.bin}</span></div>
            </div>

            <div class="row" style="margin-bottom: 16px;">
              <div class="tile tile-hero t-${dp.tint || 'sand'}">${Art.dept(it.dept)}</div>
              <div class="grow">
                <h3 class="t-h2 clamp2" style="margin-bottom: 6px;">${it.name}</h3>
                <div class="row-sm muted" style="font-size: 13.5px;"><span class="num gold" style="font-weight:700;">× ${it.qty}</span><span class="dot"></span><span>${it.unit}</span><span class="dot"></span><span class="num">${Shell.money(it.price)}</span></div>
              </div>
            </div>

            <div class="codebar num" style="margin-bottom: 16px;">${it.barcode || 'PLU ' + it.plu}</div>

            <div class="stack" style="gap: 10px;">
              <button class="btn btn-gold shine block lg" id="scanBtn"><i data-icon="scan" data-size="22"></i><span>مسح الصنف</span></button>
              <div class="btn-row">
                <button class="btn btn-ghost sm" id="subBtn"><i data-icon="swap" data-size="16"></i><span>بديل</span></button>
                <button class="btn btn-ghost sm" id="skipBtn" style="color:#FF9C7E;"><i data-icon="ban" data-size="16"></i><span>غير متوفر</span></button>
              </div>
            </div>
          </div>`;
        document.getElementById('scanBtn').onclick = openScanner;
        document.getElementById('subBtn').onclick = () => openSubstitute(currentItem);
        document.getElementById('skipBtn').onclick = () => markUnavailable(currentItem);
      }

      function renderUpcoming(items) {
        const el = document.getElementById('upcoming');
        if (!items.length) { el.innerHTML = `<div class="card soft center" style="padding:20px;"><span class="muted">لا يوجد المزيد</span></div>`; return; }
        const anim = Shell.first('upcoming') ? 'rise' : '';
        el.innerHTML = items.map((r, i) => `
          <div class="irow ${anim}" style="--i:${i}">
            <span class="bin ${r.order.bin}">${r.order.bin}</span>
            <div class="grow"><div class="nm">${r.item.name}</div>
              <div class="sub"><span class="num">${r.item.aisle}</span><span class="dot"></span><span>${Shell.qtyText(r.item)}</span></div></div>
          </div>`).join('');
      }

      function renderBins() {
        const anim = Shell.first('bins') ? 'rise' : '';
        document.getElementById('binsWrap').innerHTML = Logic.BINS.map((b, i) => {
          const o = cartOrders.find(x => x.bin === b);
          if (!o) return `<div class="card soft ${anim}" style="--i:${i}"><div class="row"><span class="bin lg ${b}">${b}</span><div class="grow"><b>فارغ</b></div><span class="badge b-mute">متاح</span></div></div>`;
          const p = Logic.progress(o);
          return `<div class="card ${anim}" style="--i:${i}">
            <div class="row" style="margin-bottom: 14px;">
              <span class="bin lg ${b}">${b}</span>
              <div class="grow"><b class="ell" style="display:block;">${o.customer.name}</b><small class="muted num">${o.id}</small></div>
              <span class="badge ${o.status === 'ready' ? 'b-ok' : 'b-gold'}">${o.status === 'ready' ? 'جاهز' : 'جاري'}</span>
            </div>
            <div class="row between" style="margin-bottom: 8px; font-size: 13px;"><span class="muted num">${p.done} / ${p.total}</span><b class="num">${p.pct}%</b></div>
            <div class="bar" style="margin-bottom: 12px;"><i style="--p:${p.pct}"></i></div>
            ${Logic.liveItems(o).map(it => `<div class="row between" style="padding: 7px 0; border-top: 1px dashed var(--line); font-size: 13.5px;">
              <div class="row-sm"><i data-icon="${it.status === 'picked' ? 'check-circle' : 'clock'}" data-size="16" style="color:${it.status === 'picked' ? 'var(--ok)' : 'var(--fg-3)'}"></i><span class="ell" style="${it.status === 'picked' ? 'opacity:.55;text-decoration:line-through;' : ''}">${it.name}</span></div>
              <span class="num muted none">${it.qty}</span></div>`).join('')}
          </div>`;
        }).join('');
      }

      function renderOrders() {
        const el = document.getElementById('ordersWrap');
        if (!cartOrders.length) { el.innerHTML = `<div class="card soft center" style="padding:20px;"><span class="muted">لا توجد طلبات</span></div>`; return; }
        el.innerHTML = cartOrders.map(o => `
          <div class="irow">
            <span class="bin lg ${o.bin}">${o.bin}</span>
            <div class="grow"><div class="nm">${o.customer.name}</div><div class="sub"><span class="num">${o.id}</span><span class="dot"></span><span>${o.status === 'ready' ? 'جاهز' : 'قيد التجميع'}</span></div></div>
            <b class="num none">${Shell.money(o.total)}</b>
          </div>`).join('');
      }

      function openScanner() {
        Shell.openSheet({
          title: 'مسح الباركود',
          html: Scanner.markup({ placeholder: 'أو اكتب الرقم', demo: true }),
          onMount: body => {
            Scanner.start('reader', code => handleScan(code), () => {
              const s = body.querySelector('#vfState'); if (s) { s.hidden = false; s.textContent = 'الكاميرا غير متاحة'; }
            });
            body.querySelector('#manualGo').onclick = () => { const v = body.querySelector('#manualCode').value.trim(); if (v) handleScan(v); };
            const d = body.querySelector('#demoScan');
            if (d) { d.querySelector('span').textContent = 'محاكاة قراءة الصنف'; d.onclick = () => currentItem && handleScan(currentItem.item.barcode || Catalog.label(Catalog.byId(currentItem.item.productId), currentItem.item.qty)); }
          },
          onClose: () => Scanner.stop()
        });
        Icons.mount();
      }

      async function handleScan(code) {
        if (!code) return;
        const r = Logic.matchScan(cartOrders, code);
        if (!r.ok) {
          beep(false); Shell.haptic(60);
          Shell.toast(r.reason === 'done' ? 'تم تجميعه مسبقاً' : 'الصنف غير مطلوب', { tone: 'bad' });
          return;
        }
        beep(true); Shell.haptic(); Shell.closeSheet();
        await AppDB.update(r.order.id, o => Logic.pick(o, r.item.id, r.kg));
        Shell.burst(`
          <div class="bin xl ${r.order.bin}">${r.order.bin}</div>
          <h2 class="t-h2" style="margin-bottom: 6px;">ضعه في الصندوق ${r.order.bin}</h2>
          <p class="muted ell" style="font-size: 14px;">${r.item.name}</p>`);
      }

      function openSubstitute(obj) {
        const it = obj.item, ord = obj.order, subs = Catalog.substitutes(it.productId, 4);
        const body = Shell.openSheet({
          title: 'اقترح بديلاً',
          html: `<div class="stack">
            <div class="card soft" style="padding: 12px 14px;"><div class="row between"><b class="ell">${it.name}</b><span class="badge b-bad none">غير متوفر</span></div></div>
            <div class="list">${subs.length ? subs.map(p => `
              <div class="irow tap" data-pick="${p.id}">
                <div class="tile tile-sm t-${(Catalog.dept(p.dept) || {}).tint || 'sand'}">${Art.dept(p.dept)}</div>
                <div class="grow"><div class="nm">${p.name}</div><div class="sub num">${Shell.money(p.price)}</div></div>
                <i data-icon="chevron-left" data-size="18" class="faint"></i>
              </div>`).join('') : '<p class="muted center">لا توجد بدائل</p>'}</div>
          </div>`
        });
        body.querySelectorAll('[data-pick]').forEach(el => el.onclick = async () => {
          const p = Catalog.byId(el.dataset.pick);
          await AppDB.update(ord.id, o => Logic.requestSub(o, it.id, p));
          Shell.closeSheet();
          Shell.toast('أُرسل البديل للعميل', { tone: 'ok', icon: 'swap' });
        });
        Icons.mount();
      }

      function markUnavailable(obj) {
        Shell.openSheet({
          title: 'حذف الصنف؟',
          html: `<div class="stack"><p class="muted">سيُحذف «${obj.item.name}» من الطلب</p>
            <div class="btn-row"><button class="btn btn-soft" data-close>تراجع</button><button class="btn btn-bad" id="okDel">حذف</button></div></div>`,
          onMount: body => body.querySelector('#okDel').onclick = async () => {
            await AppDB.update(obj.order.id, o => Logic.markUnavailable(o, obj.item.id));
            Shell.closeSheet(); Shell.toast('تم حذف الصنف', { tone: 'bad' });
          }
        });
      }
    });
  </script>
</body>
</html>
