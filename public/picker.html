<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>عربة التجميع الذكية | KartFlow Workstation</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0A1D1B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/css/style.css">

  <!-- Firebase Cloud SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/config.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/catalog.js"></script>
  <script src="/js/logic.js"></script>
  <script src="/js/db.js"></script>
  <script src="/js/shell.js"></script>
  <script src="/js/scanner.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
  <div class="app" id="app">
    <main class="stage">
      <!-- Top Band Header -->
      <header class="band">
        <div class="container band-in">
          <div class="topbar">
            <div class="brand-lockup">
              <a href="/" class="icon-btn sm" aria-label="الرئيسية"><i data-icon="chevron-right" data-size="18"></i></a>
              <div>
                <b id="cartHeaderTitle">عربة التجميع #01</b>
                <small id="pickerHeaderName">المُحضّر: أحمد طارق</small>
              </div>
            </div>
            <div class="row-sm">
              <span class="badge b-glass num" id="activeOrdersBadge">2 طلب نشط</span>
              <span class="badge b-live">
                <span class="live-dot"></span>
                <span class="num">96%</span>
              </span>
            </div>
          </div>

          <!-- Route Progress Pill Bar -->
          <div class="card ink" style="padding: 16px 20px; border-radius: var(--r-lg);">
            <div class="row between" style="margin-bottom: 8px;">
              <div class="row-sm">
                <i data-icon="route" data-size="18" style="color: var(--gold);"></i>
                <span style="font-size: 13.5px; font-weight: 600;">مسار الممرات (Aisle Sequence)</span>
              </div>
              <span class="num" id="routeProgressNum" style="font-size: 13.5px; font-weight: 700; color: var(--gold);">0 / 0 صنف</span>
            </div>
            <div class="bar"><i id="routeProgressBar" style="--p: 0;"></i></div>
          </div>
        </div>
      </header>

      <!-- Main Content Stage Views -->
      <div class="container page">
        <!-- VIEW 1: ACTIVE ROUTE & HERO CARD -->
        <div class="view" data-view="route">
          <div class="stack-lg">
            <!-- ACTIVE HERO WORKSTATION CARD -->
            <div id="heroCardWrap"></div>

            <!-- UPCOMING ROUTE ITEMS GROUPED BY AISLE -->
            <div>
              <div class="section-title">
                <h2>الأصناف المتبقية في المسار</h2>
                <span id="routeRemainingCount" class="num">0 أصناف</span>
              </div>
              <div class="list" id="routeUpcomingList"></div>
            </div>
          </div>
        </div>

        <!-- VIEW 2: BATCH BINS (PUT-TO-LIGHT BINS A, B, C) -->
        <div class="view" data-view="bins">
          <div class="stack">
            <div class="section-title">
              <h2>صناديق التجميع الحالية (Batch Bins)</h2>
              <span>نظام التوجيه الضوئي Put-to-Light</span>
            </div>
            <div class="stack" id="binsListWrap"></div>
          </div>
        </div>

        <!-- VIEW 3: ORDER SUMMARIES & LOG -->
        <div class="view" data-view="orders">
          <div class="stack">
            <div class="section-title">
              <h2>الطلبات الملحقة بالعربة</h2>
              <span id="ordersListCount" class="num">0 طلبات</span>
            </div>
            <div class="stack" id="ordersListWrap"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const CART_ID = 'CART-01';
      let allOrders = [];
      let cartOrders = [];
      let currentItem = null;

      // Audio scan feedback
      function playBeep(ok = true) {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(ok ? 920 : 260, ctx.currentTime);
          if (ok) osc.frequency.setValueAtTime(1440, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
          osc.start(); osc.stop(ctx.currentTime + 0.22);
        } catch (e) {}
      }

      // Mount Shell Navigation Immediately
      Shell.mount({
        role: 'picker',
        initial: 'route',
        tabs: [
          { id: 'route', label: 'مسار التجميع', icon: 'route' },
          { id: 'bins', label: 'الصناديق A-B-C', icon: 'box' },
          { id: 'orders', label: 'الطلبات', icon: 'list' }
        ],
        center: { id: 'scan', label: 'مسح باركود', icon: 'scan', act: true },
        onAction: act => {
          if (act === 'scan') openScannerSheet();
        }
      });

      // Hardware Barcode Scanner Listener
      Scanner.hardware(code => handleScanCode(code));

      // Listen to Real-Time Orders
      AppDB.onOrders(orders => {
        allOrders = orders;
        syncCartState();
      });

      // Background seed if database is empty
      AppDB.seedIfEmpty().catch(() => {});

      function syncCartState() {
        // Auto-claim unassigned 'new' orders into free bins if cart has space
        let freeBin = Logic.freeBin(allOrders, CART_ID);
        allOrders.forEach(o => {
          if (o.status === 'new' && !o.cartId && freeBin) {
            Logic.claim(o, CART_ID, freeBin);
            AppDB.update(o.id, ord => Logic.claim(ord, CART_ID, freeBin));
            freeBin = Logic.freeBin(allOrders, CART_ID);
          }
        });

        // Filter active orders belonging to this cart
        cartOrders = allOrders.filter(o => o.cartId === CART_ID && !['completed', 'cancelled'].includes(o.status));

        // Update Header badges
        const count = cartOrders.length;
        document.getElementById('activeOrdersBadge').textContent = `${count} طلب نشط`;

        // Calculate Route & Current Active Item
        const pendingRoute = Logic.route(cartOrders);
        const totalItemsCount = cartOrders.reduce((sum, o) => sum + Logic.liveItems(o).length, 0);
        const doneItemsCount = cartOrders.reduce((sum, o) => sum + Logic.liveItems(o).filter(i => i.status === 'picked').length, 0);
        const pct = totalItemsCount ? Math.round((doneItemsCount / totalItemsCount) * 100) : 0;

        document.getElementById('routeProgressNum').textContent = `${doneItemsCount} / ${totalItemsCount} صنف (${pct}%)`;
        document.getElementById('routeProgressBar').style.setProperty('--p', pct);
        document.getElementById('routeRemainingCount').textContent = `${pendingRoute.length} صنف متبقٍ`;

        currentItem = pendingRoute[0] || null;

        renderHeroCard(currentItem, doneItemsCount, totalItemsCount);
        renderUpcomingList(pendingRoute.slice(1));
        renderBinsView();
        renderOrdersView();
        Icons.mount();
      }

      // Render Hero Workstation Card
      function renderHeroCard(itemObj, doneCount, totalCount) {
        const wrap = document.getElementById('heroCardWrap');
        if (!itemObj) {
          // All done! Show Master QR for Cashier Fast-Pass
          wrap.innerHTML = `
            <div class="card ink" style="text-align: center; padding: 36px 20px;">
              <div class="check-draw">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
              </div>
              <h2 class="t-h1" style="color: #F4F1E8; margin-bottom: 8px;">اكتمل تجميع جميع الطلبات!</h2>
              <p class="muted" style="max-width: 380px; margin: 0 auto 24px; font-size: 14.5px;">
                تم فحص وتدقيق كافة الأصناف وتوزيعها في الصناديق A-B-C بنجاح. العربة جاهزة للتخليص السريع عند الكاشير.
              </p>
              <div style="background: #FFFFFF; padding: 18px; border-radius: 20px; display: inline-block; box-shadow: var(--shadow-2); margin-bottom: 18px;">
                <canvas id="masterQrCanvas"></canvas>
              </div>
              <div class="row center" style="justify-content: center; gap: 8px;">
                <span class="badge b-gold num" style="font-size: 14px; padding: 6px 16px;">Master QR #01</span>
                <span class="badge b-ok">جاهز للتسليم</span>
              </div>
            </div>`;

          setTimeout(() => {
            const canvas = document.getElementById('masterQrCanvas');
            if (canvas && window.QRCode) {
              QRCode.toCanvas(canvas, JSON.stringify({ cart: CART_ID, orders: cartOrders.map(o => o.id), t: Date.now() }), { width: 180, margin: 1 });
            }
          }, 60);
          return;
        }

        const it = itemObj.item;
        const ord = itemObj.order;
        const prod = Catalog.byId(it.productId) || {};

        wrap.innerHTML = `
          <div class="card ink" style="border: 1.5px solid rgba(232, 176, 58, 0.45); box-shadow: var(--shadow-2);">
            <!-- Top Badges Row -->
            <div class="row between" style="margin-bottom: 16px;">
              <span class="chip on" style="height: 34px; padding: 0 14px; font-size: 13px;">
                <i data-icon="pin" data-size="16"></i>
                <span>ممر ${it.aisle} • رف 0${it.shelf}</span>
              </span>
              <div class="row-sm">
                <span class="bin lg ${ord.bin}">${ord.bin}</span>
                <div style="text-align: start; line-height: 1.2;">
                  <b style="font-size: 12px; color: var(--gold);">ضع في صندوق</b>
                  <small style="display: block; font-size: 11px; opacity: .7;">${Shell.firstName(ord.customer.name)}</small>
                </div>
              </div>
            </div>

            <!-- Product Details Centerpiece -->
            <div class="row" style="gap: 18px; margin-bottom: 18px; align-items: center;">
              <div class="tile tile-lg t-${Catalog.dept(it.dept)?.tint || 'sand'}">
                ${Art.dept(it.dept)}
              </div>
              <div class="grow" style="min-width: 0;">
                <span class="badge b-glass" style="font-size: 11.5px; margin-bottom: 6px;">
                  ${Catalog.dept(it.dept)?.name || 'القسم'}
                </span>
                <h3 class="t-h2" style="color: #F4F1E8; margin-bottom: 8px; font-size: 19px; line-height: 1.35;">
                  ${it.name}
                </h3>
                <div class="row wrap" style="gap: 12px; color: rgba(244,241,232,.75); font-size: 14px;">
                  <span>الكمية: <b class="num" style="color: var(--gold); font-size: 16px;">${it.qty} ${it.unit}</b></span>
                  <span>•</span>
                  <span>السعر: <b class="num" style="color: #F4F1E8;">${Shell.money(it.price)}</b></span>
                </div>
              </div>
            </div>

            <!-- Target Barcode Pill -->
            <div style="background: rgba(0,0,0,.35); border: 1px dashed rgba(232,176,58,.45); border-radius: var(--r-md); padding: 10px 16px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between;">
              <div class="row-sm">
                <i data-icon="scan" data-size="18" style="color: var(--gold);"></i>
                <span class="num" style="font-size: 14.5px; letter-spacing: 1.5px; color: var(--gold); font-weight: 700;">
                  ${it.barcode || it.plu || '—'}
                </span>
              </div>
              <span class="badge b-glass" style="font-size: 11px;">الرمز المطلوب</span>
            </div>

            <!-- Action Buttons -->
            <div class="stack" style="gap: 10px;">
              <button class="btn btn-gold block lg" id="heroScanBtn">
                <i data-icon="scan" data-size="22"></i>
                <span>مسح الباركود بالكاميرا</span>
              </button>
              <div class="row" style="gap: 10px;">
                <button class="btn btn-ghost grow sm" id="heroSubBtn">
                  <i data-icon="swap" data-size="16"></i>
                  <span>اقتراح بديل للعميل</span>
                </button>
                <button class="btn btn-ghost grow sm" id="heroSkipBtn" style="color: #FF8F6B; border-color: rgba(212,85,47,.3);">
                  <i data-icon="ban" data-size="16"></i>
                  <span>غير متوفر نهائياً</span>
                </button>
              </div>
            </div>
          </div>`;

        document.getElementById('heroScanBtn').addEventListener('click', () => openScannerSheet());
        document.getElementById('heroSubBtn').addEventListener('click', () => openSubstituteSheet(itemObj));
        document.getElementById('heroSkipBtn').addEventListener('click', () => markUnavailable(itemObj));
      }

      // Render Upcoming List
      function renderUpcomingList(items) {
        const list = document.getElementById('routeUpcomingList');
        if (!items.length) {
          list.innerHTML = `<div class="card soft center" style="padding: 24px;"><p class="muted">لا توجد أصناف أخرى متبقية في المسار.</p></div>`;
          return;
        }

        list.innerHTML = items.map((r, idx) => {
          const it = r.item;
          const ord = r.order;
          return `
            <div class="irow rise" style="--i: ${idx};">
              <span class="bin ${ord.bin}">${ord.bin}</span>
              <div class="grow" style="min-width: 0;">
                <div class="nm" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${it.name}</div>
                <div class="sub row-sm">
                  <span>ممر ${it.aisle}</span>
                  <span>•</span>
                  <span class="num">${it.qty} ${it.unit}</span>
                  <span>•</span>
                  <span>${Shell.firstName(ord.customer.name)}</span>
                </div>
              </div>
              <button class="icon-btn sm ghost" onclick="quickScanItem('${it.barcode}')" title="مسح تجريبي">
                <i data-icon="check" data-size="16"></i>
              </button>
            </div>`;
        }).join('');
      }

      // Render Bins View
      function renderBinsView() {
        const wrap = document.getElementById('binsListWrap');
        const bins = ['A', 'B', 'C'];
        wrap.innerHTML = bins.map(binKey => {
          const ord = cartOrders.find(o => o.bin === binKey);
          if (!ord) {
            return `
              <div class="card soft" style="display: flex; align-items: center; justify-content: space-between;">
                <div class="row">
                  <span class="bin lg ${binKey}">${binKey}</span>
                  <div>
                    <b>الصندوق ${binKey} فارغ</b>
                    <small class="muted" style="display: block;">جاهز لاستقبال طلب جديد تلقائياً</small>
                  </div>
                </div>
                <span class="badge b-mute">متاح</span>
              </div>`;
          }

          const prog = Logic.progress(ord);
          return `
            <div class="card">
              <div class="row between" style="margin-bottom: 14px;">
                <div class="row">
                  <span class="bin lg ${binKey}">${binKey}</span>
                  <div>
                    <b>${ord.customer.name}</b>
                    <small class="muted row-sm" style="display: flex; margin-top: 2px;">
                      <span class="num">${ord.id}</span>
                      <span>•</span>
                      <span>استلام منذ ${Shell.ago(ord.createdAt)}</span>
                    </small>
                  </div>
                </div>
                <span class="badge ${ord.status === 'ready' ? 'b-ok' : 'b-gold'}">
                  ${ord.status === 'ready' ? 'مكتمل التجهيز' : 'جاري التجميع'}
                </span>
              </div>

              <div class="row between" style="margin-bottom: 6px; font-size: 13px;">
                <span class="muted">الأصناف المجمعة (${prog.done} من ${prog.total})</span>
                <span class="num" style="font-weight: 700;">${prog.pct}%</span>
              </div>
              <div class="bar" style="margin-bottom: 14px;"><i style="--p: ${prog.pct};"></i></div>

              <div class="list">
                ${ord.items.map(it => `
                  <div class="row between" style="font-size: 13.5px; padding: 6px 0; border-bottom: 1px dashed var(--line);">
                    <div class="row-sm" style="min-width: 0;">
                      <i data-icon="${it.status === 'picked' ? 'check-circle' : 'clock'}" data-size="16" style="color: ${it.status === 'picked' ? 'var(--ok)' : 'var(--fg-3)'};"></i>
                      <span style="${it.status === 'picked' ? 'text-decoration: line-through; opacity: .7;' : ''}">${it.name}</span>
                    </div>
                    <span class="num muted">${it.qty} ${it.unit}</span>
                  </div>
                `).join('')}
              </div>
            </div>`;
        }).join('');
      }

      // Render Orders View
      function renderOrdersView() {
        const wrap = document.getElementById('ordersListWrap');
        document.getElementById('ordersListCount').textContent = `${cartOrders.length} طلبات`;
        wrap.innerHTML = cartOrders.map(ord => {
          const prog = Logic.progress(ord);
          return `
            <div class="card">
              <div class="row between" style="margin-bottom: 10px;">
                <div class="row-sm">
                  <span class="bin ${ord.bin}">${ord.bin}</span>
                  <b>${ord.customer.name}</b>
                </div>
                <span class="num" style="font-weight: 700; color: var(--gold-deep);">${Shell.money(ord.total)}</span>
              </div>
              <div class="row between muted" style="font-size: 12.5px;">
                <span>رقم الطلب: <b class="num">${ord.id}</b></span>
                <span>الحالة: <b>${ord.status === 'ready' ? 'جاهز للتسليم' : 'قيد التجميع'}</b></span>
              </div>
            </div>`;
        }).join('');
      }

      // Scanner Sheet Controller
      function openScannerSheet() {
        Shell.openSheet({
          title: 'مسح باركود الصنف',
          html: Scanner.markup({ placeholder: 'امسح أو اكتب كود الباركود...', demo: true }),
          onMount: body => {
            Scanner.start('reader', code => {
              handleScanCode(code);
            }, () => {
              const state = body.querySelector('#vfState');
              if (state) {
                state.hidden = false;
                state.textContent = 'الكاميرا غير متاحة، يمكنك إدخال الكود يدوياً أو استخدام القراءة التجريبية';
              }
            });

            // Manual Code Entry
            body.querySelector('#manualGo').addEventListener('click', () => {
              const val = body.querySelector('#manualCode').value.trim();
              if (val) handleScanCode(val);
            });

            // Demo Quick Scan
            const demoBtn = body.querySelector('#demoScan');
            if (demoBtn) {
              demoBtn.addEventListener('click', () => {
                if (currentItem) handleScanCode(currentItem.item.barcode || currentItem.item.plu);
              });
            }
          },
          onClose: () => {
            Scanner.stop();
          }
        });
        Icons.mount();
      }

      // Scan Match Logic
      async function handleScanCode(code) {
        if (!code) return;
        const result = Logic.matchScan(cartOrders, code);
        if (!result.ok) {
          playBeep(false);
          Shell.toast(result.reason === 'done' ? 'تم تجميع هذا الصنف مسبقاً' : 'الباركود غير مطابق لأي صنف مطلوب في العربة', { tone: 'bad' });
          return;
        }

        // Matched successfully!
        playBeep(true);
        Shell.closeSheet();

        const { order, item, kg } = result;

        // Save picked item in DB
        await AppDB.update(order.id, o => Logic.pick(o, item.id, kg));

        // Show Full-Screen Burst Feedback
        Shell.burst(`
          <div class="bin xl ${order.bin}">${order.bin}</div>
          <h2 class="t-h2" style="margin-bottom: 6px;">تم التجميع بنجاح!</h2>
          <p class="muted" style="margin-bottom: 12px; font-size: 14.5px;">
            ضع <b>${item.name}</b> داخل <b>الصندوق ${order.bin}</b>
          </p>
          <div class="badge b-ok" style="margin: 0 auto;">طلب: ${Shell.firstName(order.customer.name)}</div>
        `);
      }

      window.quickScanItem = code => handleScanCode(code);

      // Substitution Bottom Sheet
      function openSubstituteSheet(itemObj) {
        const it = itemObj.item;
        const ord = itemObj.order;
        const subs = Catalog.substitutes(it.productId, 4);

        Shell.openSheet({
          title: 'اقتراح بديل للصنف',
          html: `
            <div class="stack">
              <div class="card soft" style="padding: 12px 14px;">
                <small class="muted">الصنف غير المتوفر حالياً:</small>
                <div class="row between" style="margin-top: 4px;">
                  <b>${it.name}</b>
                  <span class="num">${Shell.money(it.price)}</span>
                </div>
              </div>

              <div class="section-title" style="margin-top: 6px;">
                <h3 style="font-size: 15px;">البدائل الأقرب من نفس الممر (${it.aisle}):</h3>
              </div>

              <div class="list">
                ${subs.length ? subs.map(p => `
                  <div class="irow between" style="cursor: pointer;" onclick="requestSubstitute('${ord.id}', '${it.id}', '${p.id}')">
                    <div class="row" style="gap: 12px;">
                      <div class="tile tile-sm t-${Catalog.dept(p.dept)?.tint || 'sand'}">${Art.dept(p.dept)}</div>
                      <div>
                        <b>${p.name}</b>
                        <small class="muted row-sm" style="display: flex;">
                          <span>ممر ${p.aisle}</span>
                          <span>•</span>
                          <span class="num">${Shell.money(p.price)}</span>
                        </small>
                      </div>
                    </div>
                    <button class="btn btn-gold sm">اختيار وإرسال</button>
                  </div>
                `).join('') : '<p class="muted">لا توجد بدائل مباشرة مسجلة في هذا القسم.</p>'}
              </div>
            </div>`
        });
        Icons.mount();
      }

      window.requestSubstitute = async (orderId, itemId, subProductId) => {
        const subProd = Catalog.byId(subProductId);
        if (!subProd) return;
        await AppDB.update(orderId, o => Logic.requestSub(o, itemId, subProd));
        Shell.closeSheet();
        Shell.toast('تم إرسال اقتراح البديل للعميل مع مهلة 3 دقائق للرد', { tone: 'ok', icon: 'swap' });
      };

      async function markUnavailable(itemObj) {
        if (confirm(`هل أنت متأكد من عدم توفر "${itemObj.item.name}" نهائياً؟ سيتم إلغاء الصنف من الطلب.`)) {
          await AppDB.update(itemObj.order.id, o => Logic.markUnavailable(o, itemObj.item.id));
          Shell.toast('تم استبعاد الصنف وحذفه من الطلب', { tone: 'bad' });
        }
      }
    });
  </script>
</body>
</html>
