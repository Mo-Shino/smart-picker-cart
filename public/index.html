<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>KartFlow | كارت فلو</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0A1D1B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    try { if (sessionStorage.getItem('kf_splash') || location.search.includes('nosplash')) document.documentElement.classList.add('no-splash'); else sessionStorage.setItem('kf_splash', '1'); } catch (e) { document.documentElement.classList.add('no-splash'); }
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/config.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/catalog.js"></script>
  <script src="/js/logic.js"></script>
  <script src="/js/db.js"></script>
  <script src="/js/shell.js"></script>
</head>
<body>
  <!-- Intro splash (first visit per session) -->
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-in">
      <div id="splashLogo"></div>
      <b>KartFlow</b>
      <small>كارت فلو</small>
    </div>
  </div>

  <div class="welcome">
    <div class="welcome-hero">
      <div class="container hero-in" style="max-width: 680px;">
        <div class="topbar" style="margin-bottom: 20px;">
          <div class="brand-lockup">
            <div id="brandLogo"></div>
            <b>KartFlow</b>
          </div>
          <div class="grow"></div>
          <span class="badge b-live"><span class="live-dot"></span><span>مباشر</span></span>
        </div>

        <h1 class="t-display center">تجهيز أسرع.<br><span class="gold">طوابير أقل.</span></h1>

        <div id="cartArtWrap" class="center" style="margin-top: 6px;"></div>
      </div>
    </div>

    <div class="welcome-panel">
      <div class="inner stack-lg sx">
        <div class="stats">
          <div class="stat"><b class="num" data-count="4.2" data-dec="1">0</b><small>دقيقة / طلب</small></div>
          <div class="stat"><b class="num" data-count="99.8" data-dec="1">0</b><small>% دقة</small></div>
          <div class="stat"><b class="num" data-count="3">0</b><small>صناديق</small></div>
        </div>

        <div>
          <div class="section-title"><h2>اختر محطتك</h2></div>
          <div class="stack sx">
            <a href="/picker.html" class="role">
              <div class="tile t-sand"><i data-icon="cart" data-size="26"></i></div>
              <div><b>عربة التجميع</b><small>تجهيز الطلبات</small></div>
              <div class="go"><i data-icon="arrow-left" data-size="18"></i></div>
            </a>
            <a href="/customer.html" class="role">
              <div class="tile t-mint"><i data-icon="phone" data-size="26"></i></div>
              <div><b>تطبيق العميل</b><small>تتبع طلبك لحظياً</small></div>
              <div class="go"><i data-icon="arrow-left" data-size="18"></i></div>
            </a>
            <a href="/cashier.html" class="role">
              <div class="tile t-peach"><i data-icon="receipt" data-size="26"></i></div>
              <div><b>الكاشير</b><small>عبور سريع</small></div>
              <div class="go"><i data-icon="arrow-left" data-size="18"></i></div>
            </a>
            <a href="/manager.html" class="role">
              <div class="tile t-lav"><i data-icon="layout" data-size="26"></i></div>
              <div><b>لوحة المتجر</b><small>أداء اليوم</small></div>
              <div class="go"><i data-icon="arrow-left" data-size="18"></i></div>
            </a>
          </div>
        </div>

        <div class="row-sm muted center" style="justify-content: center; font-size: 13px;">
          <i data-icon="store" data-size="16"></i>
          <span>هايبر الواحة · فرع المعادي</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('brandLogo').innerHTML = Logo(40, true);
      document.getElementById('splashLogo').innerHTML = Logo(84, true);
      document.getElementById('cartArtWrap').innerHTML = Art.cart(true, 'welcome-art');
      Icons.mount();
      AppDB.seedIfEmpty().catch(() => {});

      // count-up stats once the splash has lifted
      const delay = document.documentElement.classList.contains('no-splash') ? 300 : 2200;
      setTimeout(() => {
        document.querySelectorAll('[data-count]').forEach(el => {
          const dec = +el.dataset.dec || 0;
          Shell.countUp(el, +el.dataset.count, { dur: 1100, render: v => v.toFixed(dec) });
        });
      }, delay);
    });
  </script>
</body>
</html>
