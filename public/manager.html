<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>لوحة المتجر | KartFlow</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1E4A44">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/config.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/catalog.js"></script>
  <script src="/js/logic.js"></script>
  <script src="/js/db.js"></script>
  <script src="/js/shell.js"></script>
</head>
<body>
  <div class="app" id="app">
    <main class="stage">
      <header class="band">
        <div class="container band-in">
          <div class="topbar">
            <a href="/" class="icon-btn sm" aria-label="الرئيسية"><i data-icon="chevron-right" data-size="20"></i></a>
            <div class="ttl"><b>لوحة المتجر</b><small>فرع المعادي</small></div>
            <span class="badge b-live"><span class="live-dot"></span><span>مباشر</span></span>
          </div>

          <div class="kpis sx">
            <div class="kpi t-sand">
              <div class="row between"><span class="l ell">عربات نشطة</span><div class="ico"><i data-icon="cart" data-size="16"></i></div></div>
              <div class="v num" id="kpiCarts">01</div>
            </div>
            <div class="kpi t-mint">
              <div class="row between"><span class="l ell">متوسط التجهيز</span><div class="ico"><i data-icon="timer" data-size="16"></i></div></div>
              <div class="v num">4.2m</div>
            </div>
            <div class="kpi t-sky">
              <div class="row between"><span class="l ell">دقة التجميع</span><div class="ico"><i data-icon="shield" data-size="16"></i></div></div>
              <div class="v num">99.8%</div>
            </div>
            <div class="kpi t-peach">
              <div class="row between"><span class="l ell">المبيعات</span><div class="ico"><i data-icon="receipt" data-size="16"></i></div></div>
              <div class="v num" id="kpiSales">0</div>
            </div>
          </div>
        </div>
      </header>

      <div class="container page">
        <div class="view" data-view="overview">
          <div class="section-title">
            <div class="row-sm"><h2>الطلبات</h2><span class="num" id="ordersCount">0</span></div>
            <button class="btn btn-gold sm shine" id="managerNewOrderBtn"><i data-icon="plus" data-size="16"></i><span>طلب جديد</span></button>
          </div>
          <div class="stack" id="ordersList"></div>
        </div>

        <div class="view" data-view="live">
          <div class="section-title"><h2>حركة المتجر</h2><span class="badge b-live"><span class="live-dot"></span><span>حي</span></span></div>
          <div class="card"><ul class="feed" id="feedList"></ul></div>
        </div>

        <div class="view" data-view="catalog">
          <div class="section-title"><h2>الممرات</h2><span class="num">A1 – D2</span></div>
          <div class="list" id="aislesList"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let orders = [];
      const $ = id => document.getElementById(id);

      Shell.mount({
        role: 'manager', initial: 'overview',
        tabs: [
          { id: 'overview', label: 'الطلبات', icon: 'layout' },
          { id: 'live', label: 'الحركة', icon: 'activity' },
          { id: 'catalog', label: 'الممرات', icon: 'store' }
        ],
        center: { id: 'reset', label: 'تهيئة', icon: 'refresh', act: true },
        onAction: act => { if (act === 'reset') openResetSheet(); }
      });

      AppDB.onOrders(list => { orders = list; sync(); });
      AppDB.seedIfEmpty().catch(() => {});

      const mob = $('managerNewOrderBtn');
      if (mob) {
        mob.onclick = async () => {
          Shell.haptic();
          const names = ['محمود كمال', 'نيرة أحمد', 'حسام الدين', 'ياسمين علي'];
          const name = names[Math.floor(Math.random() * names.length)];
          const o = Logic.makeOrder({
            name,
            lines: [
              { pid: 'p02', qty: 1 },
              { pid: 'p10', qty: 1 },
              { pid: 'p15', qty: 1 }
            ]
          });
          await AppDB.put(o);
          Shell.toast(`تم إنشاء طلب جديد باسم ${name}`, { tone: 'ok' });
        };
      }

      function sync() {
        const carts = new Set(orders.filter(o => o.cartId && !['completed', 'cancelled'].includes(o.status)).map(o => o.cartId)).size;
        const sales = orders.reduce((s, o) => s + (o.status !== 'cancelled' ? o.total : 0), 0);

        $('kpiCarts').textContent = String(Math.max(1, carts)).padStart(2, '0');
        $('kpiSales').innerHTML = Shell.money(sales);
        $('ordersCount').textContent = orders.length;

        renderOrders();
        renderFeed();
        renderAisles();
        Icons.mount();
      }

      function renderOrders() {
        const el = $('ordersList');
        if (!orders.length) {
          el.innerHTML = `<div class="card soft center" style="padding:20px;"><span class="muted">لا توجد طلبات</span></div>`;
          return;
        }
        const anim = Shell.first('mgr-orders') ? 'rise' : '';
        el.innerHTML = orders.map((o, i) => {
          const p = Logic.progress(o);
          const st = o.status === 'completed' ? ['مكتمل', 'b-ok'] : o.status === 'ready' ? ['جاهز', 'b-forest'] : ['جاري', 'b-gold'];
          return `
            <div class="card ${anim}" style="--i:${i}">
              <div class="row" style="margin-bottom: 12px;">
                <span class="bin lg ${o.bin || 'A'}">${o.bin || 'A'}</span>
                <div class="grow">
                  <b class="ell" style="display:block;">${o.customer.name}</b>
                  <small class="muted num">${o.id}</small>
                </div>
                <div class="none" style="text-align:end;">
                  <b class="num" style="display:block;">${Shell.money(o.total)}</b>
                  <span class="badge ${st[1]}" style="margin-top:4px;">${st[0]}</span>
                </div>
              </div>
              <div class="row between" style="font-size:12.5px;margin-bottom:6px;">
                <span class="muted num">${p.done} / ${p.total}</span>
                <b class="num">${p.pct}%</b>
              </div>
              <div class="bar"><i style="--p:${p.pct}"></i></div>
            </div>`;
        }).join('');
      }

      function renderFeed() {
        const el = $('feedList');
        const events = [];
        orders.forEach(o => (o.log || []).forEach(l => events.push({ ...l, id: o.id, name: Shell.firstName(o.customer.name) })));
        events.sort((a, b) => b.t - a.t);
        if (!events.length) {
          el.innerHTML = `<li><div class="d"></div><div class="muted">لا توجد حركات بعد</div></li>`;
          return;
        }
        el.innerHTML = events.slice(0, 20).map(e => `
          <li>
            <div class="d"></div>
            <div class="grow">
              <div class="ell"><b>${e.x}</b> <span class="muted">· ${e.name}</span></div>
              <time class="num">${Shell.ago(e.t)} · ${e.id}</time>
            </div>
          </li>`).join('');
      }

      function renderAisles() {
        const anim = Shell.first('mgr-aisles') ? 'rise' : '';
        $('aislesList').innerHTML = Catalog.DEPTS.map((d, i) => {
          const count = Catalog.products.filter(p => p.dept === d.id).length;
          return `
            <div class="irow ${anim}" style="--i:${i}">
              <div class="tile tile-sm t-${d.tint || 'sand'}">${Art.dept(d.id)}</div>
              <div class="grow">
                <div class="nm">${d.name}</div>
                <div class="sub"><span class="num">ممر ${d.aisle}</span><span class="dot"></span><span class="num">${count} صنف</span></div>
              </div>
              <span class="badge b-mute num">#${d.order}</span>
            </div>`;
        }).join('');
      }

      function openResetSheet() {
        Shell.openSheet({
          title: 'إعادة ضبط البيانات؟',
          html: `<div class="stack">
            <p class="muted">سيتم استعادة الطلبات التجريبية الافتراضية</p>
            <div class="btn-row">
              <button class="btn btn-soft" data-close>إلغاء</button>
              <button class="btn btn-gold" id="confirmReset">تأكيد</button>
            </div>
          </div>`,
          onMount: body => body.querySelector('#confirmReset').onclick = async () => {
            await AppDB.reset();
            Shell.closeSheet();
            Shell.toast('تمت إعادة الضبط', { tone: 'ok' });
          }
        });
      }
    });
  </script>
</body>
</html>
